name: Build Dan APK
run-name: Dan ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - luminex-integration-v1.25
      - dan-luminex-ai-v1.26
      - dan-agf-v1.31
      - dan-v1.31-audio-test
      - dan-v1.48-answer-only
      - dan-v1.49-pinned-order
      - dan-v1.57-local-memory
      - dan-v1.58-audio-mute
      - dan-v1.59-auto-backup
      - dan-v1.60-memory-restore
      - dan-v1.61-history-archive
      - dan-v1.62-drive-memory
      - dan-v1.64-engine-menu
      - dan-v1.65-local-chat
      - dan-v1.66-unified
      - dan-v1.67-local-server
      - dan-v1.68-chat-times
      - dan-v1.69-chat-seconds
      - dan-v1.70-conversations-memory
      - dan-v1.71-rename-chat
      - dan-v1.72-memory-voice
      - dan-v1.73-audio-controls
      - dan-v1.74-model-selector
      - dan-v1.75-phone-layout
      - dan-v1.76-identity
      - dan-v1.77-memory-audit
      - dan-v1.78-personality
      - dan-v1.79-shared-chats
      - dan-v1.80-headset-voice
      - dan-v1.82-restore-180
      - dan-v1.63-memory-engine-controls

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/dan-release.jks

      - name: Read Dan version
        run: |
          source version.properties
          echo "DAN_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "DAN_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install native Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Fetch pinned llama.cpp native source
        run: |
          mkdir -p vendor/llama.cpp
          git -C vendor/llama.cpp init
          git -C vendor/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C vendor/llama.cpp fetch --depth=1 origin de7fa0a3c6a2e1b4cd9f22eb8d6bf5b12dbdb63b
          git -C vendor/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C vendor/llama.cpp rev-parse HEAD)" = "de7fa0a3c6a2e1b4cd9f22eb8d6bf5b12dbdb63b"

      - name: Build Dan Luminex AI Integration
        env:
          LUMINEX_DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
          ANDROID_KEYSTORE_PATH: dan-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace -PDAN_VERSION_NAME="$DAN_VERSION_NAME" -PDAN_VERSION_CODE="$DAN_VERSION_CODE"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Dan-${DAN_VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dan-APK-${{ env.DAN_VERSION_NAME }}
          path: app/build/outputs/apk/release/Dan-${{ env.DAN_VERSION_NAME }}.apk
          if-no-files-found: error
