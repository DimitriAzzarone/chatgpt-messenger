name: Build Dan APK
run-name: Dan 1.45

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - luminex-integration-v1.25
      - dan-luminex-ai-v1.26
      - dan-agf-v1.31
      - dan-v1.31-audio-test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/dan-release.jks

      - name: Read Dan version
        run: |
          source version.properties
          echo "DAN_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "DAN_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build Dan Luminex AI Integration
        env:
          LUMINEX_DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
          ANDROID_KEYSTORE_PATH: dan-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace -PDAN_VERSION_NAME="$DAN_VERSION_NAME" -PDAN_VERSION_CODE="$DAN_VERSION_CODE"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Dan-${DAN_VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dan-APK-${{ env.DAN_VERSION_NAME }}
          path: app/build/outputs/apk/release/Dan-${{ env.DAN_VERSION_NAME }}.apk
          if-no-files-found: error
