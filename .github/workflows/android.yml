jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/dan-release.jks

      - name: Read Dan version
        run: |
          source version.properties
          echo "DAN_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "DAN_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Check live response observer
        run: |
          python3 tests/extract-voice-scripts.py
          node --check /tmp/dan146-observer.js
          node tests/live-observer.test.cjs
          node --check app/src/main/assets/dan-web-voice.js
          node tests/web-voice.test.cjs
          node tests/enter-send.test.cjs
          node --check app/src/main/assets/dan-composer-hint.js
          node --check app/src/main/assets/dan-file-download.js
          node tests/diary-export.test.cjs

      - name: Check recovered document boundaries
        run: |
          mkdir -p /tmp/dan-recovery-test
          javac -d /tmp/dan-recovery-test app/src/main/java/com/dimitriazzarone/chatgptmessenger/DanAttachmentRecovery.java tests/AttachmentRecoveryTest.java
          java -cp /tmp/dan-recovery-test AttachmentRecoveryTest

      - name: Check HEIWA context boundaries
        run: |
          mkdir -p /tmp/heiwa-tests
          javac -d /tmp/heiwa-tests app/src/main/java/com/dimitriazzarone/chatgptmessenger/HeiwaPrompt.java tests/HeiwaPromptTest.java
          java -cp /tmp/heiwa-tests com.dimitriazzarone.chatgptmessenger.HeiwaPromptTest

      - name: Check foreground voice loop
        run: |
          mkdir -p /tmp/heiwa-voice-tests
          javac -d /tmp/heiwa-voice-tests app/src/main/java/com/dimitriazzarone/chatgptmessenger/HeiwaPrompt.java app/src/main/java/com/dimitriazzarone/chatgptmessenger/HeiwaVoiceSession.java tests/HeiwaVoiceSessionTest.java
          java -cp /tmp/heiwa-voice-tests com.dimitriazzarone.chatgptmessenger.HeiwaVoiceSessionTest

      - name: Check Dan playback echo guard
        run: |
          mkdir -p /tmp/dan-echo-tests
          javac -d /tmp/dan-echo-tests app/src/main/java/com/dimitriazzarone/chatgptmessenger/DanVoiceBargeIn.java tests/DanVoiceBargeInTest.java
          java -cp /tmp/dan-echo-tests com.dimitriazzarone.chatgptmessenger.DanVoiceBargeInTest
      - name: Check JSON memory parser and SQLite index
        run: |
          curl --fail --location --output /tmp/heiwa-json.jar https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          mkdir -p /tmp/heiwa-json-tests
          javac -cp /tmp/heiwa-json.jar -d /tmp/heiwa-json-tests app/src/main/java/com/dimitriazzarone/chatgptmessenger/HeiwaPrompt.java app/src/main/java/com/dimitriazzarone/chatgptmessenger/HeiwaJsonReader.java tests/HeiwaJsonReaderTest.java
          java -cp /tmp/heiwa-json-tests:/tmp/heiwa-json.jar com.dimitriazzarone.chatgptmessenger.HeiwaJsonReaderTest
          python3 tests/heiwa-memory-schema.py

      - name: Install native Android toolchain
        run: sdkmanager --install "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Fetch pinned llama.cpp source
        run: |
          mkdir -p vendor/llama.cpp
          git -C vendor/llama.cpp init
          git -C vendor/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C vendor/llama.cpp fetch --depth=1 origin de7fa0a3c6a2e1b4cd9f22eb8d6bf5b12dbdb63b
          git -C vendor/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C vendor/llama.cpp rev-parse HEAD)" = "de7fa0a3c6a2e1b4cd9f22eb8d6bf5b12dbdb63b"

      - name: Build Dan Luminex AI Integration
        env:
          LUMINEX_DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
          ANDROID_KEYSTORE_PATH: dan-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease testDebugUnitTest --stacktrace -PDAN_VERSION_NAME="$DAN_VERSION_NAME" -PDAN_VERSION_CODE="$DAN_VERSION_CODE"

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-tests-${{ env.DAN_VERSION_NAME }}
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
      - name: Upload HEIWA UI previews
        uses: actions/upload-artifact@v4
        with:
          name: Heiwa-UI-${{ env.DAN_VERSION_NAME }}
          path: app/build/reports/heiwa-ui/*.png
          if-no-files-found: error

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Dan-Heiwa-${DAN_VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dan-Heiwa-APK-${{ env.DAN_VERSION_NAME }}
          path: app/build/outputs/apk/release/Dan-Heiwa-${{ env.DAN_VERSION_NAME }}.apk
          if-no-files-found: error

  heiwa-native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch pinned runtime
        run: |
          git init vendor/llama.cpp
          git -C vendor/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C vendor/llama.cpp fetch --depth=1 origin de7fa0a3c6a2e1b4cd9f22eb8d6bf5b12dbdb63b
          git -C vendor/llama.cpp checkout --detach FETCH_HEAD
      - name: Build host JNI for actual model test
        run: |
          cmake -S app/src/main/cpp -B /tmp/heiwa-native -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF
          cmake --build /tmp/heiwa-native --target dan_qwen -j 2
      - name: Download and verify the exact model offered in the app
        run: |
          curl --fail --location --retry 2 --output /tmp/qwen3.gguf 'https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/50968a4468ef4233ed78cd7c3de230dd1d61a56b/Qwen3-0.6B-Q4_K_M.gguf'
          echo 'ac2d97712095a558e31573f62f466a3f9d93990898b0ec79d7c974c1780d524a  /tmp/qwen3.gguf' | sha256sum -c -
      - name: Exercise real native generation and cancellation
        timeout-minutes: 5
        run: |
          mkdir -p /tmp/heiwa-classes
          javac -d /tmp/heiwa-classes app/src/main/java/com/dimitriazzarone/chatgptmessenger/HeiwaPrompt.java app/src/main/java/com/dimitriazzarone/chatgptmessenger/DanNativeQwen.java tests/HeiwaNativeSmoke.java
          java -Djava.library.path=/tmp/heiwa-native -cp /tmp/heiwa-classes com.dimitriazzarone.chatgptmessenger.HeiwaNativeSmoke /tmp/qwen3.gguf
