name: Build Dan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - luminex-integration-v1.25
      - dan-luminex-ai-v1.26

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Dan Luminex AI Integration
        env:
          LUMINEX_DEVICE_TOKEN: ${{ secrets.DEVICE_TOKEN }}
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Dan-Luminex-AI-Integration-v1.26.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dan-Luminex-AI-Integration-v1.26
          path: app/build/outputs/apk/debug/Dan-Luminex-AI-Integration-v1.26.apk
          if-no-files-found: error
