plugins {
    id "com.android.application"
}

android {
    namespace "com.dimitriazzarone.chatgptmessenger"
    compileSdk 35

    defaultConfig {
        applicationId "com.dimitriazzarone.danluminexai"
        minSdk 24
        targetSdk 35
        versionCode 43
        versionName "1.31-audio-test"
        buildConfigField "String", "LUMINEX_DEVICE_TOKEN",
                "\"${System.getenv('LUMINEX_DEVICE_TOKEN') ?: ''}\""
    }

    buildFeatures {
        buildConfig = true
    }

    // DAN_LUMINEX_STABLE_SIGNING_V1
    signingConfigs {
        release {
            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "dan-release.jks")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}


dependencies {
    implementation "androidx.webkit:webkit:1.17.0"
}
