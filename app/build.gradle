plugins {
    id "com.android.application"
}

android {
    ndkVersion "29.0.13113456"
    namespace "com.dimitriazzarone.chatgptmessenger"
    compileSdk 35

    defaultConfig {
        applicationId "com.dimitriazzarone.danluminexai"
        minSdk 24
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DGGML_NATIVE=OFF', '-DGGML_OPENMP=OFF',
                    '-DGGML_CPU_ALL_VARIANTS=OFF', '-DGGML_BACKEND_DL=OFF',
                    '-DGGML_CPU_KLEIDIAI=OFF', '-DLLAMA_CURL=OFF' }
        }
        versionCode 180
        versionName "1.155.19"
        // DAN 1.108: ripristino del comportamento della 1.106.
        resValue "string", "dan_launcher_label", "DAN HEIWA 1.155.19"
        buildConfigField "String", "LUMINEX_DEVICE_TOKEN",
                "\"${System.getenv('LUMINEX_DEVICE_TOKEN') ?: ''}\""
    }

    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.31.6' }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { testLogging { exceptionFormat = "full" } }
    }
    buildFeatures {
        buildConfig = true
    }

    // DAN_LUMINEX_STABLE_SIGNING_V1
    signingConfigs {
        release {
            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "dan-release.jks")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}


dependencies {
    implementation "io.noties.markwon:core:4.6.2"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    implementation "androidx.webkit:webkit:1.17.0"
    implementation "com.tom-roush:pdfbox-android:2.0.27.0"
}
