plugins {
    id "com.android.application"
}

android {
    namespace "com.dimitriazzarone.chatgptmessenger"
    compileSdk 35

    defaultConfig {
        applicationId "com.dimitriazzarone.danluminexai"
        minSdk 24
        targetSdk 35
        versionCode 36
        versionName "1.26"
        buildConfigField "String", "LUMINEX_DEVICE_TOKEN",
                "\"${System.getenv('LUMINEX_DEVICE_TOKEN') ?: ''}\""
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
